<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Notes</title>
    <link rel="stylesheet" href="libs/simplemde.min.css">
    <style>
        body {
            width: 400px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f7f7f7;
            border-radius: 8px !important;
            overflow: hidden !important;
            position: relative;
        }

        body::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 8px;
            pointer-events: none;
            box-shadow: 0 0 0 9999px #f7f7f7;
        }
        .view {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        #noteInputContainer, #noteListContainer {
            padding: 0px 4px;
        }
        .CodeMirror {
            height: 100px;
        }
        .editor-toolbar {
            border-top: none;
            border-left: none;
            border-right: none;
            padding: 0px 4px;
        }
        .CodeMirror-scroll {
            min-height: 150px;
        }
        .CodeMirror-wrap {
            border-top: 1px solid #ddd;
            border-left: none;
            border-right: none;
            border-bottom: none;
            padding: 4px 0;
        }
        .CodeMirror-lines {
            padding: 4px;
        }
        button {
            background-color: #2c3e50;
            color: #fff;
            border: 1px solid #2c3e50;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
            border-radius: 8px;
            margin-right: 8px;
        }
        button:hover {
            background-color: #364d64;
            border-color: #364d64;
        }
        button.outline {
            background-color: transparent;
            color: #2c3e50;
        }
        button.outline:hover {
            background-color: #2c3e50;
            color: #fff;
        }
        .icon-button {
            background-color: transparent;
            border: 1px solid #2c3e50;
            cursor: pointer;
            padding: 4px;
            transition: all 0.3s;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-button:hover {
            background-color: #2c3e50;
        }
        .icon-button img {
            width: 16px;
            height: 16px;
            /* Match base icon color to button color (#2c3e50) */
            filter: invert(21%) sepia(14%) saturate(1081%) hue-rotate(167deg) brightness(92%) contrast(89%);
            transition: filter 0.3s;
        }
        .icon-button:hover img {
            filter: invert(1);
        }
        /* Slightly larger icon for settings buttons only */
        #openSettingsFromMain img,
        #openSettingsFromNotes img {
            width: 18px;
            height: 18px;
        }
        /* Settings buttons: match icon-button size/rounding and stick to bottom-right */
        #openSettingsFromMain,
        #openSettingsFromNotes {
            position: absolute;
            right: 2px;
            bottom: 10px;
            width: 32px;
            height: 32px;
            padding: 4px;
            border-radius: 8px;
            box-sizing: border-box;
            z-index: 10;
        }
        #noteList {
            max-height: 200px;
            overflow-y: auto;
            margin: 10px 0 0 0; 
        }
        .note-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .note-item:hover {
            background-color: #f5f5f5;
        }
        .note-first-word {
            font-weight: bold;
            font-size: 12px;
        }
        .note-date {
            font-size: 12px;
            color: #757575;
        }
        #searchInput {
            width: calc(100% - 16px);
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
        }
        .hidden {
            display: none;
        }
        .button-container {
            display: flex;
            justify-content: flex-start;
            padding: 0px 0;
        }
        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            padding-right: 5px;
            border-bottom: none;
        }
        .note-actions {
            display: flex;
            gap: 0px;
        }
        #noteDate {
            font-size: 14px;
            color: #757575;
            margin: 0;
        }
        #noteContent .editor-preview {
            padding: 10px;
            background-color: #fff;
            border: none;
            border-radius: 0;
            overflow-x: auto;
        }
        #noteContent .editor-preview p {
            white-space: pre-wrap;
        }
        #noteContent .editor-preview pre {
            white-space: pre;
            overflow-x: auto;
        }
        .note-first-line {
            font-weight: bold;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px; /* Adjust this value as needed */
        }
        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 12px;
        }
        .settings-row:last-child {
            border-bottom: none;
        }
        .settings-title {
            margin: 0;
            padding: 10px;
        }
        .settings-footer {
            padding: 8px 10px 12px 10px;
            text-align: right;
        }
        .settings-footer a {
            color: #959694;
            text-decoration: none;
            font-size: 11px;
        }
        .settings-footer a:hover {
            color: #00E13F;
        }
        /* Settings view bottom bar: Back + right-aligned link */
        #settingsView .button-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #settingsView .button-container a {
            color: #959694;
            text-decoration: none;
            font-size: 11px;
            margin-right: 4px;
        }
        #settingsView .button-container a:hover {
            color: #00E13F;
        }
        /* Export button rectangle matching sync toggle width */
        #exportNotes {
            width: 36px;
            height: 32px;
            box-sizing: border-box;
            margin-right: 0px;
        }
        /* Simple toggle */
        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .2s;
            border-radius: 20px;
            border: 1px solid #bbb;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px; width: 16px;
            left: 1px; bottom: 1px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #2c3e50;
            border-color: #2c3e50;
        }
        input:checked + .slider:before {
            transform: translateX(16px);
        }
    </style>
</head>
<body>
    <div id="mainView">
        <div class="view">
            <div id="noteInputContainer">
                <textarea id="noteInput"></textarea>
            </div>
        </div>
        <div class="button-container">
            <button id="saveNote" data-i18n="save">Save</button>
            <button id="showNotes" class="outline" data-i18n="showNotes">Show Notes</button>
            <button id="openSettingsFromMain" class="icon-button" data-i18n-title="settings"><img src="icons/gear.svg" data-i18n-alt="settings"></button>
        </div>
    </div>

    <div id="notesView" class="hidden">
        <div class="view">
            <div id="noteListContainer" style="padding: 10px 10px 2px 10px;"> 
                <input type="text" id="searchInput" data-i18n-placeholder="search" placeholder="Search notes...">
                <div id="noteList"></div>
            </div>
        </div>
        <div class="button-container">
            <button id="backToMain" data-i18n="back">Back</button>
            <button id="openSettingsFromNotes" class="icon-button" data-i18n-title="settings"><img src="icons/gear.svg" data-i18n-alt="settings"></button>
        </div>
    </div>

    <div id="noteDetailsView" class="hidden">
        <div class="view" id="noteDetailsContainer">
            <div class="note-header">
                <h3 id="noteDate"></h3>
                <div class="note-actions">
                    <button id="editNote" class="icon-button" data-i18n-title="edit"><img src="icons/edit-pencil.svg" data-i18n-alt="edit"></button>
                    <button id="deleteNote" class="icon-button" data-i18n-title="delete"><img src="icons/trash.svg" data-i18n-alt="delete"></button>
                </div>
            </div>
            <div id="noteContent"></div>
        </div>
        <div class="button-container">
            <button id="backToNotes" data-i18n="back">Back</button>
        </div>
    </div>

    <div id="editNoteView" class="hidden">
        <div class="view">
            <div id="editNoteContainer">
                <textarea id="editNoteInput"></textarea>
            </div>
        </div>
        <div class="button-container">
            <button id="saveEditedNote" data-i18n="save">Save</button>
            <button id="cancelEditNote" class="outline" data-i18n="cancel">Cancel</button>
        </div>
    </div>

    <div id="settingsView" class="hidden">
        <div class="view">
            <h3 class="settings-title" data-i18n="settings">Settings</h3>
            <div class="settings-row">
                <span data-i18n="exportAll">Export all notes</span>
                <button id="exportNotes" class="icon-button" data-i18n-title="export"><img src="icons/export.svg" data-i18n-alt="export"></button>
            </div>
        </div>
        <div class="button-container">
            <button id="backFromSettings" data-i18n="back">Back</button>
            <a href="https://d1ma.xyz/" target="_blank" rel="noopener noreferrer">made by d1ma</a>
        </div>
    </div>

    <script src="libs/simplemde.min.js"></script>
    <script src="libs/jszip.min.js"></script>
    <script src="libs/FileSaver.min.js"></script>
    <script type="module" src="popup.js"></script>
</body>
</html>
